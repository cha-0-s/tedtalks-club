<script>
/* Set live to true once the Tally form is published. Until then a local preview is shown and nothing is sent. */
var TALLY={id:"4aKl2r",live:true};
var box=document.getElementById("form");
if(TALLY.live){
  box.innerHTML='<iframe title="Notify me about the launch" data-tally-src="https://tally.so/embed/'+TALLY.id+'?alignLeft=1&hideTitle=1&transparentBackground=1&dynamicHeight=1" height="230"></iframe>';
  var s=document.createElement("script");s.src="https://tally.so/widgets/embed.js";s.onload=function(){Tally.loadEmbeds()};document.body.appendChild(s);
}else{
  box.innerHTML='<form><input type="email" required aria-label="Your email" placeholder="you@example.com" autocomplete="email">'+
  '<label class="consent"><input type="checkbox" required><span>I am 14 or older, or a parent is signing me up. Email me when TED‑Ed Student Talks launches. I can unsubscribe at any time.</span></label>'+
  '<button>Notify me</button><p class="note">Local preview. Nothing is sent.</p></form>';
  box.firstChild.addEventListener("submit",function(e){e.preventDefault();box.innerHTML='<p class="done" role="status">Thank you. We will email you when applications open.</p>'});
}
</script>
